# Buyer personas: rule-based parameter sets, hidden from the agent.
#
# The agent never reads this file. It observes only replies and payments, which
# means it cannot win by writing text a language model happens to like. It wins
# by restraint (not burning touches into an over-contact penalty), by reading
# replies correctly, and by keeping a live payment path in front of the buyer.
#
# Units: probabilities are per-day unless the name says otherwise.
# pay_hazard_by_day is indexed by overdue bucket: [0-7, 8-14, 15-30, 31-60, 61+].

meta:
  # Days from a dispute being opened to the merchant resolving it. Applies to
  # every persona; it is a property of the merchant, not the buyer.
  dispute_resolution_days: 3
  # A touch lifts the payment hazard for this many days, then decays out.
  touch_lift_days: 3
  # Reply arrives this many days after the touch that provoked it.
  reply_delay_days: [0, 1, 1, 2]

personas:
  prompt_payer:
    weight: 0.28
    label: "Pays close to terms, replies, keeps promises"
    pay_hazard_by_day: [0.075, 0.060, 0.040, 0.022, 0.012]
    pre_due_hazard: 0.012
    touch_lift: { whatsapp: 1.6, email: 1.2, owner_persona: 1.3 }
    reply_prob: { whatsapp: 0.50, email: 0.20 }
    promise_prob_given_reply: 0.40
    promise_keep_prob: 0.80
    promise_slip_days: { mean: 2, sd: 2 }
    dispute_prob_first_touch: 0.05
    partial_first_fraction: 0.0
    over_contact: { window_days: 7, max_touches: 2, hazard_penalty: 0.5, complaint_prob: 0.20, dnc_prob: 0.10 }
    holiday_touch_penalty: 0.6
    dead_link_touch_effect: 0.0
    hour_effect: { best: [10, 17], multiplier_off_peak: 0.7 }

  chronic_late:
    weight: 0.24
    label: "Always late, replies sometimes, promises are soft"
    pay_hazard_by_day: [0.018, 0.022, 0.026, 0.024, 0.016]
